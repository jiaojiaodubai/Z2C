name: Sync Zotero Schema

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update schema from Zotero API
        run: node scripts/sync-schema.mjs

      - name: Commit and push schema changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/schema.json
          if git diff --cached --quiet; then
            echo "Schema is unchanged"
          else
            git commit -m "Update Zotero schema"
            git push
          fi
